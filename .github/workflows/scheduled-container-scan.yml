---
name: ⏰ Scheduled Container Scan

on:
  schedule:
    - cron: "0 7 * * 1-5" # Every weekday at 7AM UTC
  workflow_dispatch:

permissions: {}

jobs:
  scheduled-container-scan:
    name: Scheduled Container Scan
    permissions:
      contents: read
      security-events: write
    uses: ministryofjustice/analytical-platform-airflow-github-actions/.github/workflows/shared-scheduled-container-scan.yml@28e3b3177bcc6739cfd50b2fb13716a52c457ffe # v9.0.0
    with:
      runtime: r
    secrets:
      cve-scan-slack-webhook-url: ${{ secrets.ANALYTICAL_PLATFORM_CVE_SCAN_SLACK_WEBHOOK_URL }}
